/* 用卷宗里的记载当面戳穿 */
function doBust(){
  const m = CASE.meeting;
  const l = m.lies.find(x => S.lieOut.indexOf(x.id) >= 0 && S.lieBusted.indexOf(x.id) < 0 && S.read.has(x.bustBy));
  if(!l) return;
  talkSay("you", l.bustLine);
  talkSay("client", l.onBust);
  if(l.onBustAfter) talkSay("client", l.onBustAfter);
  S.lieBusted.push(l.id);
  portraitFlash("client", l.onBust, "grim");
  const i = S.lieBelieved.indexOf(l.id); if(i >= 0) S.lieBelieved.splice(i, 1);
  trust(-5, "当面戳穿了他");
  talkSys("他不再说那句话了。庭上你也不必替他说。");
  S.turnsLeft--;
  paint(); meetInput();
}

/* ---------- 把模型/离线的结果落到状态上 ---------- */
function applyMeet(res, txt){
  const m = CASE.meeting;

  /* 语气 → 信任。数值由前端定，模型只判语气 */
  const t = m.tone[res.tone] || m.tone.neutral;
  trust(t.trust, {warm:"你问得体贴", neutral:"例行发问", pressing:"你追得太紧", hostile:"你伤了他"}[res.tone] || "发问");

  /* 答应办不到的事 */
  if(res.flags && res.flags.promise && !S.promised){
    S.promised = true;
    trust(10, "你给了他一个承诺");
    career("conscience", -5, m.promiseNote);
  }

  /* 秘密：信任够了才说得出口 */
  (res.reveals || []).forEach(id=>{
    const sec = m.secrets.find(x=>x.id === id);
    if(!sec || S.known.indexOf(id) >= 0) return;
    if(S.trust < sec.trust) return;              // 白名单 + 门槛，模型说了不算
    S.known.push(id);
    talkSay("client", sec.truth);
    if(sec.after) talkSay("client", sec.after);
    talkSys("记下了：" + sec.note);
  });

  /* 他的回答 */
  if(res.reply) talkSay("client", res.reply);

  /* 该抛谎话了 */
  const lie = m.lies.find(l =>
    S.lieOut.indexOf(l.id) < 0 &&
    ((l.triggerMatch && new RegExp(l.triggerMatch).test(txt)) ||
     (l.triggerTurn != null && (m.turns - S.turnsLeft) >= l.triggerTurn)));
  if(lie){
    S.lieOut.push(lie.id);
    S.lieBelieved.push(lie.id);
    talkSay("client", lie.claim);
    if(S.read.has(lie.bustBy)) talkSys("你手上那份材料里，写的不是这个。");
  }

  /* 玩家自己打字戳穿 */
  const busting = m.lies.find(l =>
    S.lieOut.indexOf(l.id) >= 0 && S.lieBusted.indexOf(l.id) < 0 &&
    S.read.has(l.bustBy) && new RegExp(l.bustMatch).test(txt));
  if(busting){
    talkSay("client", busting.onBust);
    if(busting.onBustAfter) talkSay("client", busting.onBustAfter);
    S.lieBusted.push(busting.id);
    const i = S.lieBelieved.indexOf(busting.id); if(i >= 0) S.lieBelieved.splice(i, 1);
    trust(-5, "当面戳穿了他");
  }
}

/* 58-laws.js —— 法条速查
 *
 * 纯本地数据，不联网、不调模型。条文来自国家法律法规数据库，
 * 法律法规属《著作权法》第五条排除对象，不受著作权保护。
 *
 * 两个入口：右上角的「法条」按钮，和笔录里被点亮的条文号。
 */
const LAW_NAMES = Object.keys(LAWS || {}).filter(k => k[0] !== "_");
const LAW_ALIAS = (LAWS && LAWS._alias) || {};
const CN_NUM = {"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};

function cn2num(s){
  s = String(s).trim();
  if(/^[0-9]+$/.test(s)) return parseInt(s, 10);
  let total = 0, num = 0;
  for(const ch of s){
    if(ch in CN_NUM) num = CN_NUM[ch];
    else if(ch === "十"){ total += (num || 1) * 10; num = 0; }
    else if(ch === "百"){ total += (num || 1) * 100; num = 0; }
    else if(ch === "千"){ total += (num || 1) * 1000; num = 0; }
    else return null;
  }
  return total + num;
}

/* 笔录里的条文号点亮成可点的 */
const LAW_RE = LAW_NAMES.length
  ? new RegExp("(" + LAW_NAMES.join("|") + ")?第?([一二三四五六七八九十百千零0-9]{1,9})条(?:之([一二三四五六七八九十0-9]+))?", "g")
  : null;

function linkLaw(html){
  if(!LAW_RE || !LAW_NAMES.length) return html;
  LAW_RE.lastIndex = 0;
  return html.replace(LAW_RE, (all, law, num, sub)=>{
    const n = cn2num(num);
    if(n === null) return all;
    const key = sub ? n + "-" + cn2num(sub) : String(n);
    const which = law || (CASE.mainLaw || "刑法");
    if(!LAWS[which] || !LAWS[which][key]) return all;
    return `<span class="lawRef" data-law="${which}" data-art="${key}">${all}</span>`;
  });
}

/* ---------- 抽屉 ---------- */
function lawDrawer(){
  let d = $("#lawDrawer");
  if(d) return d;
  d = document.createElement("div");
  d.id = "lawDrawer";
  d.hidden = true;
  d.innerHTML = `<div class="lawHead">
      <b>法条速查</b>
      <span class="lawSrc">条文来自国家法律法规数据库</span>
      <button class="iconbtn" id="lawClose">关闭</button>
    </div>
    <input id="lawQ" placeholder="条号或关键词：264 / 第二百六十四条 / 正当防卫">
    <div id="lawResults"></div>`;
  document.body.appendChild(d);
  $("#lawClose").onclick = ()=>{ d.hidden = true; };
  $("#lawQ").oninput = ()=>renderLaw($("#lawQ").value);
  return d;
}

function openLaw(q){
  const d = lawDrawer();
  d.hidden = false;
  $("#lawQ").value = q || "";
  renderLaw(q || "");
  if(!q) $("#lawQ").focus();
}

function lawSearch(q){
  q = String(q || "").trim();
  if(!q) return [];
  const out = [];
  /* 先按条号找 */
  const m = q.match(new RegExp("^(?:(" + LAW_NAMES.join("|") + ")\\s*)?第?([一二三四五六七八九十百千零0-9]{1,9})条?(?:之([一二三四五六七八九十0-9]+))?$"));
  if(m){
    const n = cn2num(m[2]);
    if(n !== null){
      const key = m[3] ? n + "-" + cn2num(m[3]) : String(n);
      const laws = m[1] ? [m[1]] : LAW_NAMES;
      for(const law of laws){
        if(LAWS[law] && LAWS[law][key]) out.push({law, key, a: LAWS[law][key]});
      }
      if(out.length) return out;
    }
  }
  /* 罪名和常用说法。「高空抛物」是罪名，刑法二百九十一条之二正文里写的是
     「从建筑物或者其他高空抛掷物品」，光搜正文找不到。 */
  for(const k in LAW_ALIAS){
    if(k.indexOf(q) < 0 && q.indexOf(k) < 0) continue;
    for(const ref of LAW_ALIAS[k]){
      const [law, key] = ref.split(":");
      if(LAWS[law] && LAWS[law][key] && !out.some(x=>x.law===law && x.key===key))
        out.push({law, key, a: LAWS[law][key]});
    }
  }
  if(out.length) return out.slice(0, 24);

  /* 再按关键词找正文，整串命中的排前面 */
  for(const law of LAW_NAMES){
    for(const key in LAWS[law]){
      const a = LAWS[law][key];
      if(a.t.indexOf(q) >= 0 || a.n.indexOf(q) >= 0) out.push({law, key, a});
    }
  }
  if(out.length) return out.slice(0, 24);

  /* 整串搜不到就拆词再试一遍。
     「非法持有枪支」在刑法一百二十八条里写作「非法持有、私藏枪支」，中间隔着顿号，
     整串对不上，但拆成 非法/持有/枪支 三个词就都在。 */
  const terms = q.match(/[\u4e00-\u9fa5]{2}|[A-Za-z0-9]+/g);
  if(!terms || terms.length < 2) return out;
  for(const law of LAW_NAMES){
    for(const key in LAWS[law]){
      const a = LAWS[law][key];
      if(terms.every(t=>a.t.indexOf(t) >= 0)){
        out.push({law, key, a});
        if(out.length >= 24) return out;
      }
    }
  }
  return out;
}

function renderLaw(q){
  const box = $("#lawResults");
  if(!box) return;
  const hits = lawSearch(q);
  if(!String(q).trim()){
    box.innerHTML = `<div class="lawTip">本案常用的几条：</div>` +
      (CASE.lawRefs || []).map(r=>{
        const [law, key] = r.split(":");
        const a = LAWS[law] && LAWS[law][key];
        return a ? lawCard(law, key, a) : "";
      }).join("") || `<div class="lawTip">输入条号或关键词。</div>`;
    bindLawRef();
    return;
  }
  box.innerHTML = hits.length
    ? hits.map(h=>lawCard(h.law, h.key, h.a)).join("")
    : `<div class="lawTip">没找到。这一部法只收了本作用得到的条文，不是全文。</div>`;
}

function lawCard(law, key, a){
  return `<div class="lawCard"><div class="lawT">${esc(law)}${esc(a.n)}</div>
    <div class="lawB">${esc(a.t)}</div></div>`;
}

/* 笔录里点条文号 */
function bindLawRef(){
  document.querySelectorAll(".lawRef").forEach(el=>{
    if(el._bound) return;
    el._bound = true;
    el.onclick = ()=>{
      const parts = el.dataset.art.split("-");
      openLaw(el.dataset.law + "第" + parts[0] + "条" + (parts[1] ? "之" + parts[1] : ""));
    };
  });
}

/* 60-trial-cross.js —— 第三幕·举证质证
 * 本文件不含任何案件专属内容，全部读案件包。
 */
const FLAW_LABEL = {authenticity:"真实性", legality:"合法性", relevance:"关联性"};

function stageCross(){
  const item = CROSS[S.step];
  if(!item) return startDebate();
  revealFor("cross:" + S.step);
  if(item.kind === "witness") return crossWitness();
  return crossDoc(item);
}

/* ---------- 书证质证 ---------- */
function crossDoc(item){
  const e = CASE.ev[item.ev];
  say(item.intro, "pros", item.text);
  ui(`<div class="prompt">对<b>${e.name}</b>发表${L("crossN")}。可就三性分别提出，也可表示无${L("objection")}。</div>
    <div class="chips" id="tri">
      <button class="chip" data-v="authenticity">真实性有异议</button>
      <button class="chip" data-v="legality">合法性有异议</button>
      <button class="chip" data-v="relevance">关联性有异议</button>
      <button class="chip solo" data-v="none">无异议</button>
    </div>
    ${voiceHint()}
    <textarea id="say" placeholder="${"补充一句" + L("crossV") + "理由（可留空。写了会被" + L("presider") + "听进去，也会被记下来）"}"></textarea>
    <div class="row"><button class="primary" id="go">发表${L("crossN")}</button>
    ${voiceBtn("say")}
    <span class="hint">乱${L("crossV")}会消耗${L("presider")}耐心</span></div>`);
  bindChips("#tri .chip");
  $("#go").onclick = async()=>{
    const picks = multi("#tri .chip");
    if(!picks.length) return;
    const txt = $("#say").value.trim();
    const none = picks.includes("none");
    say(CASE.cast.you.who, "you", none
      ? ("对该组证据无异议。" + (txt ? "\n" + txt : ""))
      : (L("lawyer") + "对该组证据的" + picks.map(p=>FLAW_LABEL[p]).join("、") + "提出" + L("objection") + "。" + (txt ? "\n" + txt : "")));

    if(e.flaw && picks.includes(e.flaw)){
      /* 阅卷时标对了这份证据的这一项，庭上说出来就更有分量 */
      const prepared = (S.marks[item.ev] || []).indexOf(e.flaw) >= 0;
      say(CASE.judgeWho, "judge", prepared
        ? (L("lawyer") + "的意见" + L("court") + "注意到了。" + e.flawText + "。看得出" + L("lawyer") + "是看过卷的。")
        : (L("lawyer") + "的意见" + L("court") + "注意到了。" + e.flawText + "，该证据的证明力，" + (L("weighWho") || "合议庭评议时") + "会一并考虑。"));
      weakenEv(item.ev);
      const stMul = (strat() && strat().crossMul) || 1;
      hitCross(item.ev, Math.round(CASE.crossGain * (prepared ? 1.3 : 1) * stMul),
               L("crossV") + "击中" + FLAW_LABEL[e.flaw] + "瑕疵" + (prepared ? "（有备而来）" : ""));
      patience(prepared ? 5 : 3, L("crossV") + "有据");
    }else if(!none && !e.flaw){
      say(CASE.judgeWho, "judge", "辩护人，异议要有依据。这份证据来源清楚，你说说具体哪里有问题？");
      penal("baselessObjection");
    }else if(none && e.flaw){
      say(CASE.judgeWho, "judge", "记录在案。");
      penal("missedFlaw");
    }else{
      say(CASE.judgeWho, "judge", "记录在案。");
    }
    S.step++; setTimeout(stageCross, 450);
  };
  paint();
}

/* ---------- 证人 ----------
 * 发问和出示证据不冲突。先问出破绽再拿日志压上去，和上来就摊牌，不是一回事。
 */
function crossWitness(){
  const w = CASE.witness;
  S.witnessPresent = true;
  say(CASE.judgeWho, "judge", w.judgeIntro);
  say(w.who, "pros", w.line);
  witnessLoop();
}

function witnessLoop(){
  const w = CASE.witness;
  const evName = w.contradicts ? CASE.ev[w.contradicts].name : "";
  const canAsk  = S.witAsked < (w.askLimit || 0);
  /* 出示按钮的开关，看的是这个选项要出示的那份证据出没出示过。
     以前看的是 w.contradicts——c01~c03 里这两个恰好是同一份，c04 不是：
     证人证言抵触的是控方的接处警记录，要出示的是辩方的借款凭证。 */
  const showOpt = (w.options || []).find(o => o.v === "show");
  const showEvId = showOpt && (showOpt.reveal || w.contradicts);
  const canShow = !!showEvId && !S.shown.has(showEvId);
  const did = S.witAsked > 0 || S.shown.has(w.contradicts);

  ui(`<div class="prompt">${w.prompt.replace("{ev}", evName)}</div>
    <div class="chips" id="wit">
      ${canAsk  ? `<button class="chip" data-v="ask">向证人发问（还剩 ${w.askLimit - S.witAsked} 次）</button>` : ""}
      ${canShow ? `<button class="chip" data-v="show">${esc(w.options.find(o=>o.v==="show").label)}</button>` : ""}
      <button class="chip" data-v="pass">${did ? "没有问题了" : "无异议"}</button>
    </div>
    <div id="witAskBox" style="display:none">
      ${voiceHint()}
      <textarea id="witSay" placeholder="${esc(w.askPrompt || "向证人发问。")}"></textarea>
    </div>
    <div class="row"><button class="primary" id="go" disabled>提交</button>
    ${voiceBtn("witSay")}
    <span class="hint">${w.loopHint || w.hint}</span></div>`);

  let pick = null;
  document.querySelectorAll("#wit .chip").forEach(c=>c.onclick=()=>{
    document.querySelectorAll("#wit .chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel"); pick = c.dataset.v;
    $("#witAskBox").style.display = pick === "ask" ? "block" : "none";
    $("#go").disabled = false;
    if(pick === "ask") $("#witSay").focus();
  });

  $("#go").onclick = async()=>{
    if(S.busy) return;
    if(pick === "ask"){
      const txt = $("#witSay").value.trim();
      if(txt.length < 3) return;
      S.busy = true;
      say(CASE.cast.you.who, "you", txt);
      ui(`<div class="thinking">证人在想</div>`);
      const res = await witnessAnswer(txt);
      applyWitness(res);
      S.witAsked++;
      S.busy = false;
      paint(); witnessLoop(); return;
    }
    if(pick === "show"){
      const o = w.options.find(x=>x.v === "show");
      o.lines.forEach(l=>say(l[0], l[1], l[2]));
      portraitFlash("witness", "……这个我需要回去核实。");
      if(o.reveal) showEv(o.reveal);
      if(o.grants) hitPoint(o.grants.id, o.grants.v, o.grants.why);
      (o.effects || []).forEach(x=>move(x.issue, x.v, x.why));
      if(typeof o.patience === "number") patience(o.patience, o.label);
      paint(); witnessLoop(); return;
    }
    /* 结束 */
    const o = w.options.find(x=>x.v === "pass");
    if(!did){
      o.lines.forEach(l=>say(l[0], l[1], l[2]));
      (o.effects || []).forEach(x=>move(x.issue, x.v, x.why));
    }else{
      say(CASE.cast.you.who, "you", "对证人没有问题了。");
      say(CASE.judgeWho, "judge", "证人" + L("leave") + "。");
    }
    S.witnessPresent = false;
    S.step++; setTimeout(stageCross, 450);
  };
  paint();
}

/* 把问出来的破绽落到状态上 */
function applyWitness(res){
  const w = CASE.witness;
  const id = res && res.spot;
  const spot = id && w.weakSpots.find(x=>x.id === id && S.witHit.indexOf(id) < 0);
  if(!spot){
    say(w.who, "pros", (res && res.reply) || pick(w.missPool));
    patience(-1, "发问未指向要害");
    return;
  }
  S.witHit.push(spot.id);
  say(w.who, "pros", spot.reveal);
  say("", "sys", "记录在案：" + spot.note);
  /* 问出来的事实不等于论点立住。
     你把事实从证人嘴里挖出来了，但还得自己在辩论里把它说成理由。
     所以这里只记在案 + 让这个论点更有底（裁决层 ×1.25），不占用 S.hits。
     ——不这么写的话，问对了问题反而比不问少拿分（gv 8~10 换掉了辩论里的 20~40）。*/
  if(spot.grants){
    if(S.witGrants.indexOf(spot.grants) < 0) S.witGrants.push(spot.grants);
    move(spot.issue || (CASE.kp[spot.grants] ? CASE.kp[spot.grants].issue : CASE.mainIssue),
         spot.gv || 8, "问出破绽：" + spot.topic);
    say("", "sys", "这一点你问出来了。" + L("phaseDebate") + "时把它说成理由，才算立住。");
  }
  /* 不指向论点的破绽，默认加在主争点上；写了 issue 就加到那个争点。
     c07 的「不吃这个药会怎么样」不解锁任何论点，但它属于危害性那条线，
     加到主争点上就跑错地方了。 */
  else move(spot.issue || CASE.mainIssue, spot.gv || 4, "问出破绽：" + spot.topic);
  patience(3, "发问指向要害");
}
/* ─────── src/js/61-trial-debate.js ─────── */
/* 61-trial-debate.js —— 第三幕·法庭辩论
 *
 * 公诉人不是念稿的。他有一摞论点，你把哪条驳倒了他就不再提哪条；
 * 你刚立住的论点冲着谁去，他下一轮先回你那一句，再谈别的。
 */
function startDebate(){
  S.stage = PH.debate; S.round = 0; paint();
  say(CASE.judgeWho, "judge", CASE.debateIntro);
  nextRound();
}

/* 挑下一条：先回应你，再推进他自己的。都没有了就收场。 */
function pickArg(){
  /* 1) 你上一轮立住的论点，正冲着他说过的某一条 —— 他得先回这一句 */
  for(const a of CASE.prosArgs){
    if(S.argSaid.indexOf(a.id) < 0) continue;
    if(S.argRebutted.indexOf(a.id) >= 0) continue;
    if(!(a.counteredBy || []).some(d => S.lastHits.indexOf(d) >= 0)) continue;
    return {arg: a, mode: "rebut"};
  }
  /* 2) 推进一条还没说过的。已经被你驳倒的，他不会再提 */
  for(const a of CASE.prosArgs){
    if(S.argSaid.indexOf(a.id) >= 0) continue;
    if((a.counteredBy || []).some(d => S.hits.has(d))){
      S.argSaid.push(a.id);
      S.argDropped.push(a.id);
      continue;
    }
    return {arg: a, mode: "advance"};
  }
  return null;
}

async function nextRound(){
  if(S.debateOver || S.round >= CASE.debateMaxRounds) return endDebate();
  const picked = pickArg();
  /* 被你驳倒、他没再提的那些，说一句给你听 */
  while(S.argDropped.length){
    const id = S.argDropped.shift();          // 先取出来再找，别把 shift 写进 find 的回调里
    const a = CASE.prosArgs.find(x => x.id === id);
    if(a) say("", "sys", L("pros") + "没有再提「" + a.core + "」。");
  }
  if(!picked) return endDebate();

  ui(`<div class="thinking">${L("pros")}正在组织语言</div>`);
  const text = await prosSpeak(picked.arg, picked.mode);
  S.lastPros = text;
  say(CASE.prosWho, "pros", text);
  if(picked.mode === "rebut") S.argRebutted.push(picked.arg.id);
  else S.argSaid.push(picked.arg.id);
  S.curArg = picked.arg;
  offerObjection(picked.arg, picked.mode);
}

/* 论点栈空了不等于你说完了。
   你在法庭调查阶段就把他打垮的情况下，公诉人无话可说，但你自己可能还有几条没讲。
   真实庭审里辩论终结前审判长会问一句「还有没有」——这里也问。 */
function endDebate(){
  const left = Object.keys(CASE.kp).filter(k=>!S.hits.has(k));
  const canMore = !S.debateOver && !S.silenced
                  && S.finalRounds < (CASE.finalWordRounds || 3)
                  && S.round < CASE.debateMaxRounds + (CASE.finalWordRounds || 3);
  if(left.length && canMore){
    if(S.finalRounds === 0)
      say(CASE.judgeWho, "judge", L("pros") + "没有其他意见。" + L("lawyer") + "，你还有什么要说的。");
    S.finalRounds++;
    return debateInput(S.curArg || {objection: null, requires: null}, true);
  }
  say(CASE.judgeWho, "judge", CASE.debateEndLine || (L("phaseDebate") + "终结。" + L("defendant") + "，" + L("finalWord") + "。"));
  setTimeout(judge, 500);
}

/* 每轮公诉人发言后开放一次异议窗口 */
function offerObjection(arg, mode){
  if(S.silenced) return debateInput(arg);
  ui(`<div class="prompt">${L("pros")}${mode === "rebut" ? "回应了你刚才那一点" : "发言完毕"}。要提${L("objection")}吗？<b>${L("objection")}成立能直接掐掉对方的论据，不成立会挨一句。</b></div>
    <div class="chips" id="obj">
      ${Object.entries(CASE.objections).map(([k,v])=>`<button class="chip" data-v="${k}">${v.label}</button>`).join("")}
      <button class="chip solo sel" data-v="skip">不提异议</button>
    </div>
    <div class="row"><button class="primary" id="go">确定</button>
    <span class="hint">这一轮的异议窗口只有一次</span></div>`);
  bindChips("#obj .chip");
  $("#go").onclick = ()=>{
    const p = multi("#obj .chip")[0] || "skip";
    if(p !== "skip"){
      say(CASE.cast.you.who, "you", L("judge") + "，" + L("lawyer") + "提出" + L("objection") + "：" + CASE.objections[p].label);
      if(mode !== "rebut" && objectionValid(arg, p)){
        say(CASE.judgeWho, "judge", L("objection") + "成立。" + L("pros") + "，这一点请你回避，不要作为指控依据。");
        portraitFlash("judge", "异议成立。");
        penal("objectionUpheld", CASE.objections[p].issue);
        S.argSaid.indexOf(arg.id) >= 0 || S.argSaid.push(arg.id);
        S.argRebutted.push(arg.id);          // 被掐掉的论点，他不会再回头
      }else{
        say(CASE.judgeWho, "judge", L("objection") + "不成立。" + L("lawyer") + "，" + L("courtN") + "的时间有限，请把话留到" + L("opinionN") + "里。");
        portraitFlash("judge", "异议不成立。", "frown");
        penal("objectionDenied");
      }
    }
    debateInput(arg);
  };
  paint();
}

/* 异议成立的条件：提对了类型，且前置条件已满足 */
function objectionValid(a, p){
  if(a.objection !== p) return false;
  const req = a.requires;
  if(!req) return true;
  if(req.evWeak) return S.evWeak.has(req.evWeak);
  if(req.shown)  return S.shown.has(req.shown);
  if(req.point)  return S.hits.has(req.point);
  console.warn("未知的异议前置条件", req);
  return false;
}

function debateInput(arg, isFinal){
  if(S.silenced){
    ui(`<div class="prompt">你已被责令停止发言。只能等下一轮。</div>
      <div class="row"><button class="primary" id="go">坐下</button></div>`);
    $("#go").onclick = ()=>{ S.round++; S.lastHits = []; (isFinal ? endDebate : nextRound)(); };
    paint(); return;
  }
  const left = Object.keys(CASE.kp).filter(k=>!S.hits.has(k));
  const alive = CASE.prosArgs.filter(a=>!(a.counteredBy||[]).some(d=>S.hits.has(d))).length;
  ui(`<div class="prompt">${isFinal
      ? `${L("pros")}已经没话说了。<b>你还有 ${left.length} 个论点没立住</b>——趁现在。`
      : `第 ${S.round+1} 轮 · 发表你的${L("opinionN")}。
      <b>你还有 ${left.length} 个论点没立住，他还有 ${alive} 条没被驳倒。</b>`}
      说完了就说「${L("opinionN")}发表完毕」。</div>
    ${voiceHint()}
    <textarea id="say" placeholder="${esc(CASE.sayHint || ("像在" + L("onSite") + "说话那样写。空泛的话不会命中任何论点。"))}"></textarea>
    <div class="row"><button class="primary" id="go">发言</button>
    ${voiceBtn("say")}
    <button class="ghost" id="skip">放弃本轮</button>
    <span class="hint">${S.cfg.offline?"离线试玩：按规则判定":"由模型评估命中与表达"}</span></div>`);
  $("#skip").onclick = ()=>{ penal("skipDebate"); S.round++; S.lastHits = [];
    (isFinal ? endDebate : nextRound)(); };
  $("#go").onclick = async()=>{
    if(S.busy) return;
    const raw = $("#say").value.trim();
    if(raw.length < 8) return;
    S.busy = true;

    const cut = maybeInterrupt(raw);
    say(CASE.cast.you.who, "you", cut.text);
    if(cut.cut){
      say(CASE.judgeWho, "judge", "辩护人，停。");
      patience(-2, "被" + L("judge") + "打断");
    }
    ui(`<div class="thinking">${L("courtN")}在听</div>`);

    const res = await playerAct(cut.text, {note: L("phaseDebate") + "第 " + (S.round+1) + " 轮"});
    const out = handleAct(res, {phase: "debate", round: arg, text: cut.text});
    S.lastHits = out.names.map(n => Object.keys(CASE.kp).find(k => CASE.kp[k].tag === n)).filter(Boolean);
    if(new RegExp(CASE.debateEndMatch).test(cut.text)){
      S.debateOver = true;
      say(CASE.judgeWho, "judge", "记录在案。");
    }
    S.busy = false;
    S.round++;
    setTimeout(isFinal ? endDebate : nextRound, 500);
  };
  paint();
}
/* ─────── src/js/62-act.js ─────── */
/* 62-act.js —— 玩家发言的统一处理
 * 玩家在庭上说的每一句话都经过这里：多角色应答 → 按意图付出代价 → 耐心的后果。
 * 分数由 30-engine.js 的 adjudicate() 说了算，本文件只负责流程和表演。
 */

function sayAs(key, text){
  const c = CASE.cast[key] || CASE.cast.judge;
  return say(c.who, c.cls, text);
}

/* 耐心低于 40 时，长发言有概率被审判长打断，只记前半句 */
function maybeInterrupt(txt){
  if(S.patience >= 40 || txt.length < 20) return {text: txt, cut: false};
  if(rnd() > 0.30 + (40 - S.patience) / 200) return {text: txt, cut: false};
  return {text: txt.slice(0, Math.max(8, Math.floor(txt.length * 0.6))) + "——", cut: true};
}

/* 耐心见底的后果 */
function patienceFallout(){
  if(S.patience <= 0 && !S.silenced){
    S.silenced = true;
    sayAs("judge", L("lawyer") + "，你的发言到此为止。");
    say("", "sys", (CASE.lex && CASE.lex.patienceOut) || (L("presider") + "的耐心用尽了。本阶段你不能再发言。"));
    career("rep", -5, "被" + L("silence"));
    return true;
  }
  if(S.patience < 20 && !S.admonished){
    S.admonished = true;
    sayAs("judge", L("court") + "对" + L("lawyer") + "予以" + L("admonish") + "，记录在案。");
    portraitFlash("judge", L("court") + "予以" + L("admonish") + "。", "grim");
    career("rep", -3, "当场" + L("admonish"));
  }
  return false;
}

function renderReply(res){
  (res.reply || []).slice(0, 3).forEach(r=>{
    if(r && r.text) sayAs(r.who, String(r.text));
  });
}

/* 处理一次发言。opt.phase: "cross" | "debate" | "interject" */
function handleAct(res, opt){
  opt = opt || {};
  const out = {names: [], gained: 0, stopped: false};
  const act = res.act || "辩论";
  const f = res.flags || {};

  /* 论点只有在发表辩论/质证意见时才算数。骂人骂出一个论点是不算的。 */
  let adj = null;
  if(act === "辩论" || act === "质证"){
    adj = adjudicate(res);
    adj.hits.forEach(h=>{
      hitPoint(h.id, h.v, "立住论点：" + CASE.kp[h.id].tag);
      out.names.push(CASE.kp[h.id].tag);
      out.gained += h.v;
    });
  }

  renderReply(res);

  /* 你在庭上替他说了那句谎话 */
  /* 这一句被当庭戳穿的话，代价已经在这儿收过了。
     下面就不要再按「空泛」补一刀——那句话不空泛，它是假的，两个罚名不该叠。 */
  const quoted = opt.phase === "debate" ? checkQuotedLie(res, opt.text) : false;

  switch(act){
    case "闲聊":
      patience(f.injection ? -10 : -8, f.injection ? "答非所问" : "与本案无关");
      break;
    case "失礼":
      patience(-12, "言辞不当");
      career("rep", -1, L("onSite") + "失礼");
      break;
    case "申请":
      patience((res._motion && res._motion.patience) || -4, "申请不予准许");
      break;
    case "与当事人交流":
      patience(-5, L("hearing") + "中与" + L("defendant") + "交谈");
      break;
    case "发问":
      patience(S.witnessPresent ? -1 : -3, S.witnessPresent ? "发问" : "证人已" + L("leave"));
      break;
    case "异议":
      if(opt.phase !== "objection"){
        sayAs("judge", L("objection") + "应当在对方发言之后立即提出。现在提，晚了。");
        patience(-3, "异议不合时宜");
      }
      break;
    case "程序":
      break;
    default:  /* 辩论 / 质证 */
      if(out.names.length) patience(4, "论证有力");
      else if(quoted) break;
      else if(adj && adj.needEv){
        /* 讲的是对的，可是这一节的证据还没出示。这不是空泛，是漏了一步，
           法官会说出漏了哪一步——不然玩家只看见「空泛」，不知道自己错在哪。 */
        const ev = CASE.ev[adj.needEv];
        say(CASE.judgeWho, "judge",
            L("lawyer") + "主张的这一节，相应证据没有出示。" + (ev ? "《" + ev.name + "》不在" + L("onSite") + "。" : ""));
        patience(-2, "论点缺前置证据");
      }
      else penal(((res && res.q) || 5) >= 7 ? "sound" : "vague");
  }

  if(out.names.length)
    say("", "sys", "本轮立住：" + out.names.join("、") + "　表达评分 " + ((res && res.q) || 7) + "/10");

  out.stopped = patienceFallout();
  return out;
}

/* 会见时没戳穿的谎，庭上引用出来就是这个下场 */
function checkQuotedLie(res, txt){
  const m = CASE.meeting;
  if(!m || S.lieFired || !S.lieBelieved.length) return false;
  const byModel = !!(res.flags && res.flags.quotedLie);
  const l = m.lies.find(x => S.lieBelieved.indexOf(x.id) >= 0 &&
    (byModel || (x.courtMatch && new RegExp(x.courtMatch).test(txt || ""))));
  if(!l) return false;
  S.lieFired = true;
  portraitFlash("pros", "这句话，" + L("lawyer") + "怎么解释？");
  sayAs("pros",  l.courtProsLine);
  sayAs("judge", l.courtJudgeLine);
  move(l.penalty.issue, l.penalty.v, l.penalty.why);
  patience(l.penalty.patience, "被当庭戳穿");
  say("", "sys", "你替他说了一句他自己都不敢再说的话。");
  return true;
}
/* ─────── src/js/63-interject.js ─────── */
/* 63-interject.js —— 插话
 * 庭上你随时可以举手说一句。说什么都行，但法庭会当真——包括当真地驳回你。
 * 和主流程分开挂在 #aside，不会被 ui() 覆盖。
 */
function mountAside(){
  const box = $("#aside");
  if(!box) return;
  if(S.stage < PH.cross || S.stage > PH.debate || S.silenced){ box.innerHTML = ""; return; }
  box.innerHTML = `<button class="ghost tiny" id="asideBtn">${L("lawyer")}，我有话说</button>`;
  $("#asideBtn").onclick = openInterject;
}

function openInterject(){
  const box = $("#aside");
  box.innerHTML = `<div class="interject">
    ${voiceHint()}
    <textarea id="asideSay" placeholder="向${L("courtN")}说一句。申请、发问、程序性意见都行——没轮到你的话，${L("judge")}会让你坐下。"></textarea>
    <div class="row">
      <button class="primary" id="asideGo">说</button>
      ${voiceBtn("asideSay")}
      <button class="ghost" id="asideCancel">算了</button>
      <span class="hint">插话有代价，法官的耐心是有限的</span>
    </div></div>`;
  bindVoice();
  $("#asideSay").focus();
  $("#asideCancel").onclick = mountAside;
  $("#asideGo").onclick = async()=>{
    if(S.busy) return;
    const raw = $("#asideSay").value.trim();
    if(raw.length < 2) return;
    S.busy = true;
    box.innerHTML = `<div class="interject"><div class="thinking">${L("judge")}看了你一眼</div></div>`;

    const cut = maybeInterrupt(raw);
    say(CASE.cast.you.who, "you", cut.text);
    if(cut.cut){ say(CASE.judgeWho, "judge", L("lawyer") + "，停。"); patience(-2, "被" + L("judge") + "打断"); }

    const res = await playerAct(cut.text, {note: "未轮到发言时的插话"});
    /* 插话不算辩论意见，论点不在这里计分 */
    if(res.act === "辩论" || res.act === "质证"){
      res.hit = [];
      if(!res.reply || !res.reply.length)
        res.reply = [{who: "judge", text: "这些话留到" + L("opinionN") + "里说。"}];
    }
    handleAct(res, {phase: "interject"});
    S.busy = false;
    mountAside();
  };
}

async function judge(){

  say(cl.judgeWho, "judge", cl.judgeLine);
  say(cl.clientWho, "pros", cl.clientLine);
  say("","sys","合议庭评议中");
  ui(`<div class="thinking">合议庭评议中</div>`);
  const t=total();
  const v=CASE.verdicts.find(x=>t>=x.min);
  const doc = await verdictDoc(v, t);
  const st = settleCase(v, t);
  career("rep", st.rep, "结案：" + v.r);
  career("conscience", st.con, "结案：" + v.r);

  showVerdict(v, t, doc, st);
}

function SVGMissed(missed){
  if(!missed.length) return `<p class="sub" style="margin-top:14px;color:var(--ok)">四个论点你全立住了。这种打法在现实里极少见。</p>`;
  return `<h3 style="margin-top:22px;font-size:15px">没说出口的话</h3>

    `<div class="e"><span>${p.tag}：${p.desc}</span><b class="dn">未用</b></div>`).join("")}</div>`;
}

/* 70-career.js —— 生涯外壳
 *
 * 律所一屏：三轨、上一案的余波、接下一个案子。
 * 存档分两层：META 是生涯（跨案），SAVE 是当前这个案子打到哪了。
 */

/* ══════════════ 1、生涯存档 ══════════════ */
const CAREER0 = {rep: 0, cash: 50000, conscience: 0, done: [], best: {}, log: []};

function metaLoad(){
  try{
    const s = localStorage.getItem(META_KEY);
    if(s) return Object.assign({}, CAREER0, JSON.parse(s));
  }catch(e){}
  return JSON.parse(JSON.stringify(CAREER0));
}
function metaSave(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }

let META = metaLoad();

/* ══════════════ 2、当前案件的存档 ══════════════ */
const SET_KEYS = ["hits", "crossHits", "shown", "evWeak", "skim", "read"];
let _saveTimer = null;

function saveGame(){
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{
    try{
      const o = {};
      for(const k in S){
        if(k === "cfg") continue;
        o[k] = (S[k] instanceof Set) ? [...S[k]] : S[k];
      }
      o.digest = S.digest.slice(-20);
      localStorage.setItem(SAVE_KEY, JSON.stringify(
        {v: SAVE_VERSION, caseId: PACK.id, at: Date.now(), s: o}));
    }catch(e){ console.warn("存档失败", e); }
  }, 400);
}

function savedGame(){
  try{
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return null;
    const d = JSON.parse(s);
    /* 存档存的是哪个案子，就按哪个案子恢复。
       以前这里拿 d.caseId 和当前绑定的 PACK.id 比——刷新之后 PACK 还是默认那个案子，
       所以只有存的正好是默认案时才续得上，存别的案一律当作废，直接回事务所。 */
    if(d.v !== SAVE_VERSION) return null;                        // 版本对不上就作废
    if(!CASES.some(c => c.id === d.caseId)) return null;         // 案件包没了也作废
    return d;
  }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

function applySave(d){
  const o = d.s;
  for(const k in o){
    if(SET_KEYS.indexOf(k) >= 0) S[k] = new Set(o[k]);
    else if(k !== "cfg") S[k] = o[k];
  }
}

/* ══════════════ 3、律所一屏 ══════════════ */
function officeScreen(note){

        </div>

        <h3 class="pickH">接哪个案子</h3>
        <div class="caseCards">${show.map(cardOf).join("")}</div>
        ${fresh.length === 0 ? `<p class="sub">这一期的案子你都打过了。再打一次也行——同一个案子，换个打法，结果不一样。</p>`
          : (old.length ? `<p class="sub">打过的案子也能重接。换个策略，结果不一样。</p>` : "")}

function track(name, v, sub, money){
  const s = money ? (v >= 10000 ? (v/10000).toFixed(1) + " 万" : v + " 元")
                  : (v > 0 ? "+" + v : String(v));
  const col = money ? "var(--paper)" : v > 0 ? "var(--ok)" : v < 0 ? "var(--pros)" : "var(--muted)";
  return `<div class="tk"><b style="color:${col}">${s}</b><span>${name}</span><i>${sub}</i></div>`;
}

function cardOf(c){
  const done = META.done.indexOf(c.id) >= 0;
  const best = META.best[c.id];
  return `<div class="caseCard" data-id="${c.id}">
    <div class="cc-h"><b>${esc(c.meta.title)}</b>

      <span>${esc(c.meta.clientMood || "")}</span>

    </div>
  </div>`;
}

function takeCase(id){
  clearSave();
  useCase(id);
  resetCase();
  document.body.classList.remove("phase-office");

/* ══════════════ 4、结案结算 ══════════════ */
function settleCase(v, t){
  const st = strat();
  const notes = [];
  let con = v.con, rep = v.rep;

  /* 良心的账，算在你对当事人做过什么上，不算在你替谁说话上 */
  if(st && st.id === "lenient" && t >= 50){
    con -= 8; notes.push("你选了认罪求轻判。庭审打到最后，这个案子本来是能做无罪的。");
  }
  if(st && st.id === "innocent"){
    if(t >= 50){ con += 12; notes.push("你顶着他的意思做了无罪辩护，你赌赢了。"); }
    else if(t < 0){ con -= 15; notes.push("他想认罪求个轻判，你没听。现在他要多坐几年。"); }
  }
  if(S.promised && t < 20){
    con -= 5; notes.push("你答应过他一件你办不到的事。他记着。");
  }
  if(S.lieFired){
    rep -= 3; notes.push("你在庭上替他说了一句被当场戳穿的话。这事会传出去。");
  }

  const fee = (PACK.meta && PACK.meta.fee) || 0;
  META.rep += rep;
  META.conscience += con;
  META.cash += fee;
  if(META.done.indexOf(PACK.id) < 0) META.done.push(PACK.id);
  const prev = META.best[PACK.id];
  if(!prev || t > (META.bestT && META.bestT[PACK.id] || -999)){
    META.best[PACK.id] = v.r;
    META.bestT = META.bestT || {}; META.bestT[PACK.id] = t;
  }
  META.log = notes.length ? notes : ["这个案子过去了。"];
  metaSave(META);
  clearSave();
  return {rep, con, fee, notes};
}

/* 结局那一段。按最终心证挑。 */
function epilogueOf(t){
  const e = CASE.epilogue || {};
  if(t >= 50) return e.acquit;
  if(t >= 20) return e.light;
  if(t >= 0)  return e.heavy;
  return e.worst;
}

    say("", "sys", "（接上次）\n" + S.digest.slice(-6).join("\n"));

  if(id === "file"){
