<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C232B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
<meta name="description" content="一款中文庭审模拟：读卷、会见、开庭，靠证据一分一分挣审判长的心证。">
<!-- 加到手机桌面之后，按独立应用起，不带浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="心证">
<meta name="application-name" content="心证">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<title>心证 · 庭审模拟</title>
<style>
<!--INJECT:CSS-->
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>心证</h1>
      <span>第一案 · 取款机的一百七十一次</span>
    </div>
    <div class="stagebar" id="stagebar">

    </div>
    <button class="iconbtn" id="btnFile" style="display:none" aria-label="卷宗"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 4.2h4.2l1.2 1.6H14v7.4H2z"/></svg><b>卷宗</b></button>
    <button class="iconbtn" id="btnLaw">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 3.2v10M3 4.6h10M4.6 4.6 2.6 9.2h4zM11.4 4.6l-2 4.6h4zM5.4 13.2h5.2"/></svg><b>法条</b>
    </button>
    <button class="iconbtn" id="btnCfg">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.2v2M8 12.8v2M1.2 8h2M12.8 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M12.8 3.2l-1.4 1.4M4.6 11.4l-1.4 1.4"/></svg><b>设置</b></button>
  </header>

  <main>
    <div class="col left" id="fileCol">
      <!-- 案情摘要。以前只喂给模型，玩家看不到，等于开局不知道自己在辩什么。 -->
      <div class="sect" id="briefSect">
        <h2>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2h8v12H4z"/><path d="M6 5.5h4M6 8h4M6 10.5h2.5"/></svg>
          起诉书
        </h2>
        <div id="briefBox"></div>
      </div>
      <div class="sect">
        <h2>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3.5h4.5l1.2 1.6H14v7.4H2z"/></svg>
          <span id="evTitle">在卷证据</span>
        </h2>
        <div id="evList"></div>
      </div>
      <div class="sect">
        <h2>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5" r="2.4"/><path d="M3 13.5c0-2.6 2.2-4.2 5-4.2s5 1.6 5 4.2"/></svg>
          出庭人员
        </h2>
        <div id="castList"></div>
      </div>
      <div class="sect">
        <h2>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v12M3 6h10M4.5 10.5h7"/></svg>
          争议焦点
        </h2>
        <div id="issueList"></div>
      </div>
      <div style="height:20px"></div>
    </div>

    <div class="col mid">
      <div id="docview"></div>
      <div id="talk"></div>
      <div id="record"></div>
      <div id="action"></div>
      <div id="aside"></div>
    </div>

    <div class="col right">
      <div class="scale">
        <svg viewBox="0 0 220 130" aria-label="法官心证天平">
          <g stroke="var(--line2)" stroke-width="2" fill="none">
            <path d="M70 122h80"/><path d="M110 122V34"/>
          </g>
          <circle cx="110" cy="31" r="3.5" fill="var(--brass)"/>
          <g id="beam">
            <line x1="34" y1="31" x2="186" y2="31" stroke="var(--brass)" stroke-width="2.4"/>
            <g id="panL">
              <line x1="34" y1="31" x2="34" y2="56" stroke="var(--line2)" stroke-width="1.4"/>
              <path d="M16 56h36l-8 15H24z" fill="none" stroke="var(--pros)" stroke-width="1.8"/>
            </g>
            <g id="panR">
              <line x1="186" y1="31" x2="186" y2="56" stroke="var(--line2)" stroke-width="1.4"/>
              <path d="M168 56h36l-8 15h-20z" fill="none" stroke="var(--def)" stroke-width="1.8"/>
            </g>
          </g>
        </svg>
        <div class="val" id="sVal">0</div>
        <div class="lab" id="sLab">势均力敌</div>
      </div>
      <div class="pat">
        <div class="patRow"><div class="patFace" id="patFace"></div>
        <div class="patMeta"><div class="t"><span>法官耐心</span><i id="patLab">尚有耐心</i></div>
        <div class="patBar"><div class="patFill" id="patFill"></div></div>
        </div></div>
      </div>
      <div class="ledger" id="ledger"></div>
      <div id="fileSide"></div>
      <div id="meetSide"></div>
    </div>
  </main>

  <!-- 窄屏用的底部标签栏。桌面隐藏。三栏在手机上原来是上下叠着的，
       每一栏都只剩一条缝；改成一次只显示一屏，各自占满高度。 -->
  <nav id="tabbar" aria-label="面板切换">
    <button data-pane="left"><span class="ti">卷宗</span></button>
    <button data-pane="mid" class="on"><span class="ti">笔录</span><i class="dot" hidden></i></button>
    <button data-pane="right"><span class="ti">心证</span></button>
  </nav>
</div>
<script>
<!--INJECT:ARTDATA-->
<!--INJECT:DATA-->
<!--INJECT:JS-->
</script>
</body>
</html>
